    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">
            <!--
                nombre
                telefono
                tamaño
                edad
                comentario / sobre la mascota            
            -->
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">telefono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-tamaño-mascota">tamaño de mascota</label>
            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <option value="C">Chico</option>
                <option value="G">Grande</option>
                <option value="M">Mediano</option>
            </select>

            <label for="id-edad">edad</label>
            <input type="number" name="edad" id="id-edad">

            <label for="id-comentario">comentario mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>
            <!----->
            <!----->
            <input type="submit" value="Enviar">

            <button type="reset">
                Limpiar 
            </button>   
            <button type="submit">
                Enviar
            </button>
        </form>
        <h2>Donde Estamos</h2>
        <iframe src= "https://www.google.com/maps/embed?pb=!4v1788354734714!6m8!1m7!1scHK2WHlzsWqejnbbVlTinQ!2m2!1d-31.41998311676656!2d-64.18896344891786!3f42.06!4f0!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>" frameborder="0"></iframe>
    </main>

            </li>

</body>
</html>
